name: Sync to CNB
on: [push]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to CNB
        run: |
          CNB_URL="https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/weicshine/docmost.git"

          git remote remove cnb 2>/dev/null || true
          git remote add cnb "$CNB_URL"

          echo "== remotes =="
          git remote -v

          echo "== test access =="
          git ls-remote cnb

          git push cnb --all
          git push cnb --tags